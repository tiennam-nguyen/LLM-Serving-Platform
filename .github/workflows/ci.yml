name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**", "test/**", "docs/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      use_gpu:
        description: "Run against live GPU worker (requires self-hosted GPU runner)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unified Verification Pipeline (Week 1 -> Current Milestone)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python backend & CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -e .
          python -m pip install ".[ci]"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Frontend dependencies & Playwright Chromium
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Unified Verification Entrypoint (Default CI = --no-gpu)
        run: |
          if [ "${{ inputs.use_gpu }}" = "true" ]; then
            python infra/scripts/verify.py
          else
            python infra/scripts/verify.py --no-gpu
          fi
