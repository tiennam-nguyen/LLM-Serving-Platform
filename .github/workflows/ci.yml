name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: CPU/Mock Verification (W1, W2, W3, W4, W6, W7, W8)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python backend & CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ci,analysis]"

      - name: Set up Node.js >= 22.23.4
        uses: actions/setup-node@v6
        with:
          node-version: ">=22.23.4 <23.0.0"
          check-latest: true
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies & Playwright Chromium
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: "1/7 — Python lint & static checks"
        id: lint
        run: python infra/scripts/verify.py --target lint --no-gpu

      - name: "2/7 — Backend unit tests"
        id: unit
        run: python infra/scripts/verify.py --target unit --no-gpu

      - name: "3/7 — Backend integration tests"
        id: integration
        run: python infra/scripts/verify.py --target integration --no-gpu

      - name: "4/7 — Implemented milestone gates (W1, W2, W3, W4, W6)"
        id: gates
        run: |
          for target in w1 w2 w3 w4 w6; do
            python infra/scripts/verify.py --target "$target" --no-gpu
          done

      - name: "5/7 — Week 7 full experiment pipeline gate (W7)"
        id: w7
        run: python infra/scripts/verify.py --target w7 --no-gpu

      - name: "6/7 - Week 8 controlled benchmark CPU gate"
        id: w8
        run: python infra/scripts/verify.py --target w8 --no-gpu

      - name: "7/7 — Frontend lint, typecheck, unit, build & Playwright"
        id: web
        run: python infra/scripts/verify.py --target web --no-gpu

      - name: Publish verification summary
        if: always()
        run: |
          {
            echo "## CPU/Mock Verification Summary"
            echo
            echo "Implemented milestone gates: W1, W2, W3, W4, W6, W7, W8 (Week 5 two-machine LAN validation is intentionally separate)."
            echo
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| Python lint/static | ${{ steps.lint.outcome }} |"
            echo "| Backend unit | ${{ steps.unit.outcome }} |"
            echo "| Backend integration | ${{ steps.integration.outcome }} |"
            echo "| Implemented milestone gates (W1, W2, W3, W4, W6) | ${{ steps.gates.outcome }} |"
            echo "| Week 7 full experiment pipeline gate (W7) | ${{ steps.w7.outcome }} |"
            echo "| Week 8 controlled benchmark CPU gate | ${{ steps.w8.outcome }} |"
            echo "| Frontend lint, typecheck, unit, build & Playwright | ${{ steps.web.outcome }} |"
            echo
            echo "> Hosted CI is intentionally CPU/mock-only and does not verify GPUs. Live dual-T4 GPU and LAN failure/recovery evidence is collected on real hardware."
          } >> "$GITHUB_STEP_SUMMARY"
