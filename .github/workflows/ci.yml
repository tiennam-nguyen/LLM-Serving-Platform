name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Week 1-4 CPU/Mock Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python backend & CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -e .
          python -m pip install "fastapi>=0.110.0" "httpx>=0.27.0" "uvicorn>=0.29.0" "pydantic>=2.6.0" "pytest>=8.0.0" "pytest-asyncio>=0.23.0" "ruff>=0.4.0"

      - name: Set up Node.js >= 22.23.4
        uses: actions/setup-node@v6
        with:
          node-version: ">=22.23.4 <23.0.0"
          check-latest: true
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies & Playwright Chromium
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: "1/5 — Python lint & static checks"
        id: lint
        run: python infra/scripts/verify.py --target lint --no-gpu

      - name: "2/5 — Backend unit tests"
        id: unit
        run: python infra/scripts/verify.py --target unit --no-gpu

      - name: "3/5 — Backend integration tests"
        id: integration
        run: python infra/scripts/verify.py --target integration --no-gpu

      - name: "4/5 — Cumulative milestone gates (W1 → W4)"
        id: gates
        run: python infra/scripts/verify.py --target gates --no-gpu

      - name: "5/5 — Frontend lint, typecheck, unit, build & Playwright"
        id: web
        run: python infra/scripts/verify.py --target web --no-gpu

      - name: Publish verification summary
        if: always()
        run: |
          {
            echo "## Week 1-4 verification summary"
            echo
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| Python lint/static | ${{ steps.lint.outcome }} |"
            echo "| Backend unit | ${{ steps.unit.outcome }} |"
            echo "| Backend integration | ${{ steps.integration.outcome }} |"
            echo "| Cumulative W1-W4 gates | ${{ steps.gates.outcome }} |"
            echo "| Frontend + browser | ${{ steps.web.outcome }} |"
            echo
            echo "> Hosted CI is intentionally CPU/mock-only. Real GPU and LAN failure/recovery evidence is collected on actual hardware."
          } >> "$GITHUB_STEP_SUMMARY"
