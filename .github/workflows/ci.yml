name: CI (CPU / No-GPU Verification)

on:
  push:
    branches: ["main", "w3-complete", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  backend-ci:
    name: Backend Lint, Type & No-GPU Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install lightweight CI dependencies (no GPU/CUDA wheel required)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -e .
          python -m pip install "fastapi>=0.110.0" "httpx>=0.27.0" "uvicorn>=0.29.0" "pydantic>=2.6.0" "pytest>=8.0.0" "pytest-asyncio>=0.23.0" "ruff>=0.4.0"

      - name: Run Ruff linter
        run: python -m ruff check .

      - name: Run Ruff format check
        run: python -m ruff format --check .

      - name: Run Pytest suite in --no-gpu mode
        run: python -m pytest --no-gpu

      - name: Run Week 3 E2E verification script in --no-gpu mode
        run: |
          python infra/scripts/verify_week3_e2e.py --no-gpu
          python infra/scripts/verify_week2_exit_gate.py --no-gpu --requests 5

  frontend-ci:
    name: Frontend Lint, Typecheck, Unit & Playwright E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run Vitest unit & component tests
        run: npm test

      - name: Build Next.js production bundle
        env:
          NEXT_PUBLIC_DEFAULT_MODEL: "Qwen/Qwen2.5-0.5B-Instruct"
          NEXT_PUBLIC_GATEWAY_URL: "http://127.0.0.1:8080"
        run: npm run build

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright browser E2E suite against wire fixture
        run: npm run test:browser
