name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      use_gpu:
        description: "Run against live GPU worker (requires self-hosted GPU runner)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unified Verification Pipeline (Week 1 -> Current Milestone)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python backend & CI dependencies (without heavy CUDA/vLLM wheels)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -e .
          python -m pip install "fastapi>=0.110.0" "httpx>=0.27.0" "uvicorn>=0.29.0" "pydantic>=2.6.0" "pytest>=8.0.0" "pytest-asyncio>=0.23.0" "ruff>=0.4.0"

      - name: Set up Node.js >= 22.23.4 (patched for CVE-2026-111497)
        uses: actions/setup-node@v4
        with:
          node-version: ">=22.23.4 <23.0.0"
          check-latest: true
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Frontend dependencies & Playwright Chromium
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Unified Verification Entrypoint (Default CI = --no-gpu)
        run: |
          if [ "${{ inputs.use_gpu }}" = "true" ]; then
            python infra/scripts/verify.py
          else
            python infra/scripts/verify.py --no-gpu
          fi
